[project]
name = "madplan"
version = "0.1.0"
description = "Ugentlig madplan med samlet indkøbsliste"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=23",
    "fastapi>=0.115",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
    "recipe-scrapers>=15",
    "sqlalchemy>=2.0.30",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
madplan-admin = "madplan.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
madplan = ["ingredients/data/*.txt", "migrations/*.py", "migrations/script.py.mako", "migrations/versions/*.py"]
