# Prøveudgaven af Madplan (det nye design) ved siden af den rigtige app.
# Egen adresse, egen database, egen login-nøgle. Deler intet med driften.
# Kør fra denne mappe i prøve-kopien af koden:  ./deploy.sh
# Kræver en .env-fil ved siden af (se .env.example). Den må ALDRIG committes.

name: proeve

services:
  tailscale:
    image: tailscale/tailscale:stable
    # Giver adressen https://madplan-proeve.<tailnet>.ts.net
    hostname: madplan-proeve
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ../serve.json:/config/serve.json:ro
    networks: [proeve]
    restart: unless-stopped
    mem_limit: 256m
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build: ../..
    environment:
      - APP_SECRET=${APP_SECRET}
    volumes:
      - madplan-data:/data
    networks: [proeve]
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    logging: *logs

networks:
  proeve:

volumes:
  tailscale-state:
  madplan-data:
